<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Forgot Password | Fabbies Pizza</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    :root {
      --primary: #e53935;
      --dark: #333;
      --light: #f9f9f9;
      --gray: #777;
      --success: #43a047;
    }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #ffebee, #ffcdd2);
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .reset-container {
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      width: 100%;
      max-width: 420px;
      text-align: center;
    }
    .logo {
      margin-bottom: 20px;
    }
    .logo img {
      width: 80px;
      border-radius: 50%;
    }
    h2 {
      color: var(--primary);
      margin: 0 0 10px;
    }
    p.subtitle {
      color: var(--gray);
      font-size: 14px;
      margin-bottom: 25px;
    }
    .form-group {
      text-align: left;
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: var(--dark);
      font-weight: 500;
    }
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      box-sizing: border-box;
    }
    button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px 20px;
      width: 100%;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }
    button:hover {
      background: #c62828;
      transform: translateY(-1px);
    }
    button:active {
      transform: translateY(0);
    }
    .message {
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      margin: 15px 0;
      display: none;
    }
    .success { background: #e8f5e9; color: var(--success); }
    .error { background: #ffcdd2; color: var(--primary); }
    .back-link {
      display: block;
      margin-top: 15px;
      color: var(--primary);
      text-decoration: none;
      font-size: 14px;
    }
    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="reset-container">
    <div class="logo">
      <img src="https://raw.githubusercontent.com/fabbiespizza/fabbies-pizza/main/images/logo.jpg" alt="Fabbies Pizza">
    </div>
    <h2>Reset Your Password</h2>
    <p class="subtitle">Enter your email to receive a 6-digit reset code</p>

    <div id="message" class="message"></div>

    <form id="forgot-form">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="you@example.com" required />
      </div>
      <button type="submit">Send Reset Code</button>
    </form>

    <a href="login.html" class="back-link">← Back to Login</a>
  </div>

  <script>
    document.getElementById('forgot-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const messageEl = document.getElementById('message');

      // Clear previous message
      messageEl.style.display = 'none';

      try {
        const res = await fetch('http://localhost:5000/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });

        const data = await res.json();

        if (res.ok) {
          messageEl.textContent = `✅ A 6-digit code has been sent to ${email}`;
          messageEl.className = 'message success';
          messageEl.style.display = 'block';

          // Redirect to reset-password.html after 1.5s
          setTimeout(() => {
            window.location.href = `reset-password.html?email=${encodeURIComponent(email)}`;
          }, 1500);
        } else {
          messageEl.textContent = `❌ ${data.error}`;
          messageEl.className = 'message error';
          messageEl.style.display = 'block';
        }
      } catch (err) {
        messageEl.textContent = '❌ Could not connect to server. Check if backend is running.';
        messageEl.className = 'message error';
        messageEl.style.display = 'block';
      }
    });
  </script>
</body>
</html>
