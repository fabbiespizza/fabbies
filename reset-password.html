<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Set New Password | Fabbies Pizza</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    :root {
      --primary: #e53935;
      --dark: #333;
      --light: #f9f9f9;
      --gray: #777;
      --success: #43a047;
    }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #e8f5e8, #c8e6c9);
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .reset-container {
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      width: 100%;
      max-width: 420px;
      text-align: center;
    }
    .logo {
      margin-bottom: 20px;
    }
    .logo img {
      width: 80px;
      border-radius: 50%;
    }
    h2 {
      color: var(--primary);
      margin: 0 0 10px;
    }
    p.subtitle {
      color: var(--gray);
      font-size: 14px;
      margin-bottom: 25px;
    }
    .form-group {
      text-align: left;
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: var(--dark);
      font-weight: 500;
    }
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      box-sizing: border-box;
    }
    button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px 20px;
      width: 100%;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }
    button:hover {
      background: #c62828;
      transform: translateY(-1px);
    }
    button:active {
      transform: translateY(0);
    }
    #resend-code {
      background: #666 !important;
      padding: 0 12px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
    }
    #resend-code:hover {
      background: #555 !important;
    }
    .message {
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      margin: 15px 0;
      display: none;
    }
    .success { background: #e8f5e9; color: var(--success); }
    .error { background: #ffcdd2; color: var(--primary); }
    .email-display {
      font-size: 14px;
      color: var(--gray);
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="reset-container">
    <div class="logo">
      <img src="https://raw.githubusercontent.com/fabbiespizza/fabbies-pizza/main/images/logo.jpg" alt="Fabbies Pizza">
    </div>
    <h2>Create New Password</h2>
    <p class="subtitle">Enter the 6-digit code and your new password</p>

    <div class="email-display" id="email-display">Email: loading...</div>

    <div id="message" class="message"></div>

    <form id="reset-form">
      <div class="form-group">
        <label for="reset-code">6-Digit Code</label>
        <div style="display: flex; gap: 10px;">
          <input type="text" id="reset-code" maxlength="6" placeholder="123456" required />
          <button type="button" id="resend-code">Resend</button>
        </div>
      </div>
      <div class="form-group">
        <label for="new-password">New Password</label>
        <input type="password" id="new-password" minlength="6" placeholder="At least 6 characters" required />
      </div>
      <button type="submit">Reset Password</button>
    </form>
  </div>

  <script>
    // Get email from URL
    const urlParams = new URLSearchParams(window.location.search);
    const email = urlParams.get('email');
    const messageEl = document.getElementById('message');

    if (email) {
      document.getElementById('email-display').textContent = `Code sent to: ${email}`;
    } else {
      messageEl.textContent = '❌ No email provided. Redirecting...';
      messageEl.className = 'message error';
      messageEl.style.display = 'block';
      setTimeout(() => {
        window.location.href = 'forgot-password.html';
      }, 1500);
    }

    // ===== RESET PASSWORD SUBMIT =====
    document.getElementById('reset-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const code = document.getElementById('reset-code').value.trim();
      const newPassword = document.getElementById('new-password').value;

      if (!code || !newPassword) {
        messageEl.textContent = '❌ All fields are required';
        messageEl.className = 'message error';
        messageEl.style.display = 'block';
        return;
      }

      if (newPassword.length < 6) {
        messageEl.textContent = '❌ Password must be at least 6 characters';
        messageEl.className = 'message error';
        messageEl.style.display = 'block';
        return;
      }

      try {
        const res = await fetch('http://localhost:5000/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, code, newPassword })
        });

        const data = await res.json();

        if (res.ok) {
          messageEl.textContent = '✅ Password reset! Redirecting to login...';
          messageEl.className = 'message success';
          messageEl.style.display = 'block';

          setTimeout(() => {
            window.location.href = 'login.html';
          }, 1500);
        } else {
          messageEl.textContent = `❌ ${data.error}`;
          messageEl.className = 'message error';
          messageEl.style.display = 'block';
        }
      } catch (err) {
        messageEl.textContent = '❌ Could not connect to server.';
        messageEl.className = 'message error';
        messageEl.style.display = 'block';
      }
    });

    // ===== RESEND CODE BUTTON =====
    document.getElementById('resend-code')?.addEventListener('click', async () => {
      if (!email) {
        messageEl.textContent = '❌ No email found. Please go back.';
        messageEl.className = 'message error';
        messageEl.style.display = 'block';
        return;
      }

      try {
        const res = await fetch('http://localhost:5000/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });

        const data = await res.json();

        if (res.ok) {
          messageEl.textContent = `✅ A new code has been sent to ${email}`;
          messageEl.className = 'message success';
          messageEl.style.display = 'block';
        } else {
          messageEl.textContent = `❌ ${data.error}`;
          messageEl.className = 'message error';
          messageEl.style.display = 'block';
        }
      } catch (err) {
        messageEl.textContent = '❌ Could not connect to server.';
        messageEl.className = 'message error';
        messageEl.style.display = 'block';
      }
    });
  </script>
</body>
</html>
