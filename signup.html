<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up | Fabbies Pizza</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    :root {
      --primary: #e53935;
      --primary-dark: #c62828;
      --dark: #333;
      --light: #f9f9f9;
      --gray: #777;
      --border-radius: 12px;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #ffebee, #ffcdd2);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-y: auto;
    }
    .signup-container {
      background: white;
      padding: 30px;
      border-radius: var(--border-radius);
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      width: 100%;
      max-width: 420px;
      text-align: center;
      border: 1px solid #eee;
    }
    .signup-logo {
      display: block;
      margin-bottom: 20px;
      text-align: center;
    }
    .signup-logo img {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      object-fit: cover;
    }
    h2 {
      color: var(--primary);
      margin: 0 0 10px;
      font-size: 1.6rem;
    }
    p.subtitle {
      color: var(--gray);
      font-size: 14px;
      margin-bottom: 25px;
    }
    .form-group {
      text-align: left;
      margin-bottom: 18px;
      position: relative;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: var(--dark);
      font-weight: 500;
      font-size: 14px;
    }
    input[type="text"],
    input[type="email"],
    input[type="tel"],
    input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #ddd;
      border-radius: var(--border-radius);
      font-size: 16px;
      transition: border-color 0.2s ease;
    }
    input[type="text"]:focus,
    input[type="email"]:focus,
    input[type="tel"]:focus,
    input[type="password"]:focus {
      outline: none;
      border-color: var(--primary);
    }
    .password-toggle {
      position: absolute;
      right: 12px;
      top: 40px;
      cursor: pointer;
      color: var(--gray);
      font-size: 16px;
    }
    .password-toggle:hover {
      color: var(--primary);
    }
    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      margin: 12px 0;
    }
    .checkbox-group label {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--dark);
      cursor: pointer;
    }
    .checkbox-group input[type="checkbox"] {
      margin: 0;
      transform: scale(1.2);
    }
    button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px 20px;
      width: 100%;
      font-size: 16px;
      border-radius: var(--border-radius);
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }
    button:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }
    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }
    .back-link {
      display: block;
      margin-top: 15px;
      color: var(--primary);
      text-decoration: none;
      font-size: 14px;
    }
    .back-link:hover {
      text-decoration: underline;
    }
    .message {
      padding: 12px;
      border-radius: var(--border-radius);
      font-size: 14px;
      margin: 15px 0;
      display: none;
    }
    .success { background: #e8f5e9; color: #1b5e20; }
    .error { background: #ffcdd2; color: var(--primary); }
  </style>
</head>
<body>
  <div class="signup-container">
        <a href="index.html" class="signup-logo" aria-label="Fabbies Pizza Home">
            <img src="https://raw.githubusercontent.com/fabbiespizza/fabbies-pizza/main/images/logo.jpg" alt="Fabbies Pizza Logo">
        </a>
    <h2>Create Account</h2>
    <p class="subtitle">Join us and enjoy delicious pizza!</p>

    <div id="message" class="message"></div>

    <form id="signup-form">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" placeholder="Enter your full name" required />
      </div>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required />
      </div>
      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" placeholder="+92 300 1234567" required />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="At least 6 characters" minlength="6" required />
        <span class="password-toggle" onclick="togglePassword('password', this)">
          <i class="fas fa-eye"></i>
        </span>
      </div>
      <div class="form-group">
        <label for="confirm-password">Confirm Password</label>
        <input type="password" id="confirm-password" name="confirm-password" placeholder="Re-enter your password" required />
        <span class="password-toggle" onclick="togglePassword('confirm-password', this)">
          <i class="fas fa-eye"></i>
        </span>
      </div>
      <div class="checkbox-group">
        <label>
          <input type="checkbox" id="remember-me">
          <span>Remember me</span>
        </label>
      </div>
      <button type="submit">Sign Up</button>
    </form>

    <p class="back-link">Already have an account? <a href="login.html">Login</a></p>
  </div>

  <script>
    // Toggle Password Visibility
    function togglePassword(id, iconElement) {
      const input = document.getElementById(id);
      const icon = iconElement.querySelector('i');
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.replace('fa-eye', 'fa-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.replace('fa-eye-slash', 'fa-eye');
      }
    }

    // Form Validation & Submission
    document.getElementById('signup-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const formData = new FormData(form);
      const data = Object.fromEntries(formData);

      // Password match validation
      if (data.password !== data['confirm-password']) {
        showMessage('❌ Passwords do not match.', 'error');
        return;
      }

      try {
        const res = await fetch('http://localhost:5000/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: data.name,
            email: data.email,
            phone: data.phone,
            password: data.password
          })
        });

        const result = await res.json();

        if (res.ok) {
          showMessage('✅ Account created! Redirecting to login...', 'success');
          setTimeout(() => {
            window.location.href = 'login.html';
          }, 1500);
        } else {
          showMessage(`❌ ${result.error}`, 'error');
        }
      } catch (err) {
        showMessage('❌ Could not connect to server.', 'error');
      }
    });

    // Show message in message box
    function showMessage(text, type) {
      const messageEl = document.getElementById('message');
      messageEl.textContent = text;
      messageEl.className = `message ${type}`;
      messageEl.style.display = 'block';
    }
  </script>
</body>
</html>
